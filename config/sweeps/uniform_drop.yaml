# The reference settings trained on 1000andUniform, Tom1000 plus the uniform
# matrix at target 2400, for the uniform-optimum investigation
# (src/tm_ml/uniform/, docs/notes/uniform_optimum.md).
#
# Rationale: U is 1.4 nats per row or more from every Tom1000 matrix, and the
# reference model scores it at 671 and rates matrices elsewhere at 10⁵. A real
# labelled point at U is the data-side version of the anchor and head that the
# investigation added to the model; this asks whether data alone does the job.
#
# Everything else is the best input_norm cell without node standardization,
# results/input_norm/TMVAE_b0p01-bw20-dg1-do0p1-enormfixed-e600-ll3-lff0p05-schcosine{,-s1,-s2}_Tom1000,
# at its three seeds. U is in the training split for all three. The splits of
# the other 1000 matrices differ from Tom1000's, since n changed.
#
#   pixi run -e ml pipeline --configfile config/sweeps/uniform_drop.yaml -c12 --resources gpu=3

data:
  drop: 1000andUniform

model:
  d_latent: 8
  d_global: 1
  beta: 0.01
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: 3.0
  lambda_recon: 1.0
  edge_norm: fixed

training:
  parent_path: uniform_drop
  seed: [0, 1, 2]
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: auto
