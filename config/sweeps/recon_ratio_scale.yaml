# Scale control for `recon_ratio.yaml`: same ratio, double the weights.
#
# (lambda_recon 2, lambda_log 6) has the identical recon : log_recon ratio as the
# (1, 3) cell of the ratio sweep, but twice the weight on the reconstruction
# block relative to beta and gamma. If the two cells agree, the ratio is the
# real axis and the dilution argued for in `recon_ratio.yaml` does not bite at
# this magnitude; if they differ, the balance against beta is doing the work and
# every conclusion drawn from the lambda_log ladder needs that caveat attached.
#
# Three runs, one per seed, read against the lambda_recon = 1.0 column next door.
#
#   pixi run -e ml pipeline --configfile config/sweeps/recon_ratio_scale.yaml -c4 --resources gpu=1

# Result, three seeds each: (2, 6) does NOT reproduce (1, 3). KL 151.4 vs 117.1,
# log_recon 0.516 vs 0.650, scatter 0.335 vs 0.404. It lands with the (2, 3)
# cell instead — same lambda_recon, different lambda_log — so the ratio is not
# the axis and the reconstruction block's weight against beta is. The caveat in
# `recon_ratio.yaml` therefore bites: part of what the lambda_log ladder in
# `log_recon.yaml` measured was beta being diluted and latent capacity bought.
#
# What survives that caveat is the decomposition, because the lambda_recon = 0
# cell separates the two effects. It has the lowest capacity in the sweep
# (KL 17.6, one active unit) and yet the second-smallest bias, +0.045. If
# centering came from capacity, that cell would be the worst; it is not. So
# lambda_log sets where the log-space error sits and capacity sets how tight it
# is, and the ladder's bias result stands while its recon and scatter gains are
# partly capacity.
#
# Per doubling, lambda_recon buys about 3x the capacity lambda_log does — 1 -> 2
# adds 26 nats of KL, 3 -> 6 adds 8.5 — which follows from recon weighting an
# entry by T_ij against this term's flat lambda_log / 380.

model:
  d_latent: 8
  beta: 0.05
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: 6.0
  lambda_recon: 2.0

training:
  parent_path: initial_testing/recon_ratio_sweep
  seed: [0, 1, 2]
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: 2
