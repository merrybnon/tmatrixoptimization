#   pixi run -e ml pipeline --configfile config/sweeps/log_recon_wd0.yaml -c4 --resources gpu=1 -n
#   pixi run -e ml pipeline --configfile config/sweeps/log_recon_wd0.yaml -c4 --resources gpu=1

model:
  d_latent: 8
  beta: 0.05
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: [0.3, 1.0, 3.0, 10.0]

training:
  parent_path: initial_testing/log_recon_sweep
  seed: 2
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: 2
