# The uniform_max head and the star-shaped constraint together, for the
# uniform-optimum investigation (src/tm_ml/uniform/).
#
# Rationale: the uniform_max head makes ŷ(enc U) = 2000 and nothing higher, but
# its maximum is a whole surface through U, and matrix-space search stops on it
# 1.5 nats per row from U. The star constraint asks ŷ to rise strictly along
# segments toward U, which should leave U the only point at the top. The head
# replaces the anchor, which it makes redundant.
#
# Everything else is the reference run, at its three seeds; the control is
# results/input_norm/TMVAE_b0p01-bw20-dg1-do0p1-enormfixed-e600-ll3-lff0p05-schcosine{,-s1,-s2}_Tom1000
#
#   pixi run -e ml pipeline --configfile config/sweeps/uniform_head_star.yaml -c12 --resources gpu=3

model:
  d_latent: 8
  d_global: 1
  beta: 0.01
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: 3.0
  lambda_recon: 1.0
  edge_norm: fixed
  prop_head: uniform_max
  lambda_star: [1.0, 10.0]

training:
  parent_path: uniform_head_star
  seed: [0, 1, 2]
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: auto
