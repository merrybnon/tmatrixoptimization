# The property weight gamma, replicated over three seeds.
#
# Rationale: the property overfits (train prop ~0.07 against val prop 0.15-0.25
# at epoch 600) while gamma has sat at 1 on every run. The recon_ratio sweep is
# nearly a gamma sweep, since Adam is near scale-invariant in the total and
# lowering lambda_recon raises gamma against the reconstruction block: at
# lambda_recon 0.25 and 0, R2 rose on every seed, by ~0.05. Raising gamma also
# moves checkpoint selection toward the property, which prop's ~0.2 of a ~2.7
# val_score barely steers today. The expected cost is reconstruction.
#
# Everything else is the fixed-edge, layernorm-node cell of input_norm.yaml.
# gamma = 1 is left out on purpose: parent_path is not determining, so it
# would retrain those runs under a new folder. The control is
# results/input_norm/TMVAE_b0p01-bw20-dg1-do0p1-enormfixed-e600-ll3-lff0p05-schcosine{,-s1,-s2}_Tom1000.
#
#   pixi run -e ml pipeline --configfile config/sweeps/gamma.yaml -c8 --resources gpu=1 -n
#   pixi run -e ml pipeline --configfile config/sweeps/gamma.yaml -c8 --resources gpu=1

model:
  d_latent: 8
  d_global: 1
  beta: 0.01
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: 3.0
  lambda_recon: 1.0
  edge_norm: fixed
  gamma: [3.0, 5.0, 10.0, 15.0, 30.0]

training:
  parent_path: gamma_sweep
  seed: [0, 1, 2]
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: 1
