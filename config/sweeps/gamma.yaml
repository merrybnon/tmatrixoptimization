# This config sweeps over different values of γ.
#
#   L = λ_recon·recon + β·kl + γ·prop + λ_log·log_recon
#
#   recon     = Σ_i Σ_{j≠i} T_ij (log T_ij − log T̂_ij)
#   kl        = KL(q(z|T) ‖ N(0, I))
#   prop      = (log ŷ − log y)²
#   log_recon = mean_{i≠j} |log T_ij − log T̂_ij|
#
#   pixi run -e ml pipeline --configfile config/sweeps/gamma.yaml -c8 --resources gpu=1 -n
#   pixi run -e ml pipeline --configfile config/sweeps/gamma.yaml -c8 --resources gpu=1

model:
  d_latent: 8
  d_global: 1
  beta: 0.01
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: 3.0
  lambda_recon: 1.0
  edge_norm: fixed
  gamma: [3.0, 5.0, 10.0, 15.0, 30.0]

training:
  parent_path: gamma_sweep
  seed: [0, 1, 2]
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: 1
