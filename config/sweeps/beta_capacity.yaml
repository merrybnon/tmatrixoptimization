# beta at the settled reconstruction weights, replicated over three seeds.
#
# Rationale: across `log_recon.yaml` and `recon_ratio.yaml`, every reconstruction
# outcome tracked the KL and nothing else — log_recon, the log-space scatter and
# the fit slope all move with latent capacity, and lambda_log and lambda_recon
# were reaching capacity sideways rather than being axes of their own. The
# `recon_ratio_scale.yaml` control settled that: (2, 6) does not reproduce (1, 3)
# but lands with (2, 3), so the reconstruction block's weight against beta is
# what these knobs were really setting. beta is the direct knob, and 09-16 found
# it sets the effective width where d_latent does not.
#
# Held at lambda_recon 1, lambda_log 3: the cell where bias is +0.005, already
# centred, so anything that moves here is resolution rather than centring.
#
# 15 runs, ~9 min each.
#
#   pixi run -e ml pipeline --configfile config/sweeps/beta_capacity.yaml -c4 --resources gpu=1

model:
  d_latent: 8
  beta: [0.01, 0.02, 0.05, 0.10, 0.15]
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: 3.0
  lambda_recon: 1.0

training:
  parent_path: initial_testing/beta_capacity_sweep
  seed: [0, 1, 2]
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: 2
