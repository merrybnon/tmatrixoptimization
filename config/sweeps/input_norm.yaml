# Fixed standardization against LayerNorm as the first step on the raw node and
# edge features, all four combinations × three seeds.
#
# A per-vector LayerNorm on the five edge features is nearly scale-invariant in
# the two logs, so a symmetric pair at 1e-2 and one at 1e-8 normalize to within
# 0.003 of each other, and the diagonal lands beside them with is_self drowned.
# "fixed" standardizes each feature against constants fitted on the training
# split's off-diagonal pairs, which keeps the magnitude. Node features get the
# same treatment, where the effect should be milder.
#
# Everything else is the d_global 1 cell of global_dims.yaml. layernorm ×
# layernorm is that cell retrained under the current code, as the control.
#
#   pixi run -e ml pipeline --configfile config/sweeps/input_norm.yaml -c8 --resources gpu=2

model:
  d_latent: 8
  d_global: 1
  beta: 0.01
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: 3.0
  lambda_recon: 1.0
  node_norm: [layernorm, fixed]
  edge_norm: [layernorm, fixed]

training:
  parent_path: input_norm
  seed: [0, 1, 2]
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: auto
