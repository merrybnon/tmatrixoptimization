# A predictor whose maximum is the uniform matrix by construction, for the
# uniform-optimum investigation (src/tm_ml/uniform/).
#
# Rationale: an anchor pins ŷ(enc U) to 2000 at one point and a cap bounds ŷ
# everywhere, but neither stops another matrix from scoring above U. The
# uniform_max head writes the slides' claim into the function itself:
#
#   log ŷ(x) = log 2000 − ‖A·(φ(x) − φ(x_U))‖²
#
# φ the predictor's hidden layers, x_U the pooled encoding of U under the
# current weights, A a learned 16 × 64 projection. ŷ(enc U) = 2000 exactly
# and nothing scores above it. What is left to learn is how fast ŷ falls away
# from U, which the data, all at least 1.4 nats per row from U, supply.
#
# Everything else is the reference run, at its three seeds; the control is
# results/input_norm/TMVAE_b0p01-bw20-dg1-do0p1-enormfixed-e600-ll3-lff0p05-schcosine{,-s1,-s2}_Tom1000
#
#   pixi run -e ml pipeline --configfile config/sweeps/uniform_head.yaml -c12 --resources gpu=3

model:
  d_latent: 8
  d_global: 1
  beta: 0.01
  beta_warmup_epochs: 20
  dropout: 0.1
  lambda_log: 3.0
  lambda_recon: 1.0
  edge_norm: fixed
  prop_head: uniform_max

training:
  parent_path: uniform_head
  seed: [0, 1, 2]
  epochs: 600
  lr_schedule: cosine
  lr_final_frac: 0.05
  log_every: 50

runtime:
  gpu: auto
